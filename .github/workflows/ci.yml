name: CI

on:
  push:
    branches: [main, 'slice/**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scanning needs history

      # Direct gitleaks invocation, digest-pinned — the marketplace action
      # failed opaquely on the repo's first push; this is the identical scan
      # verified against the full local history (ADR-0002-era spike included).
      - name: Secret scanning
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect -s /repo --no-banner

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Service-role containment
        run: node scripts/check-service-role-containment.mjs

      - name: Exposed-schema pin (ADR-0004 R2)
        run: node scripts/check-exposed-schemas.mjs

      - name: Start local Postgres (Supabase, pinned CLI)
        run: npx supabase db start

      - name: Reset database from migrations
        run: npm run db:reset

      - name: Verify exact migration state (clean leg)
        run: node scripts/verify-migration-state.mjs supabase/migrations

      # Round-7 E3: full failing output is ALWAYS retained as an artifact —
      # a flake must be classifiable from what the run kept, not from
      # re-runs. The grep-free tee preserves per-test detail and durations.
      - name: Database tests (pgTAP)
        run: set -o pipefail; npm run test:db 2>&1 | tee pgtap-clean.log

      - name: Database tests (two-session concurrency layer)
        run: set -o pipefail; npm run test:concurrency 2>&1 | tee concurrency-clean.log

      - name: Schema lint (db:verify, warnings fail)
        run: npm run db:verify

      # 2B: the app test surface — config pins (§5.5), the import fences,
      # lib/db factory + request-role channel contracts (live against the
      # started database), the AC-AUTH-8 snapshot vs hc.tier_defaults(),
      # route byte-identity/non-enumeration and the founder/invitee door
      # contracts. The Playwright walkthrough (§11.4-3) is deliberately
      # NOT a CI gate in 2B — it needs the full auth stack and browsers —
      # and is run at build verification and the round-10 gate (ADR-0014).
      # Round-18 F-7. The fence transient has now hit FIVE times in one slice
      # across two fence files, and the fifth could not be NAMED because that
      # run was not recorded. `test:app` now writes .vitest/run.json on every
      # invocation — names, durations and failure messages, with the exit code
      # intact — and CI additionally tees the console text, which is where a
      # worker that dies without reporting a case shows up. `set -o pipefail`
      # is what keeps the tee from masking a red (ADR-0026 D16 item 9).
      - name: Application tests (vitest)
        run: set -o pipefail; npm run test:app 2>&1 | tee vitest-app.log

      # Round-16 R6/F-5. ADR-0022 D1 says every byte of fixtures/g9 is
      # generated by the builder, so "never real family material" is true BY
      # CONSTRUCTION. `--check` is the only thing that compares the tree to
      # the spec table, and it was not in CI — so the guarantee reduced to
      # "true if someone remembers to run it". tests/eval/corpus.test.ts only
      # checks the manifest against ITSELF (each file's bytes hash to the
      # manifest's own sha256), which a contributor who swapped in real
      # material and updated the hash would pass. This is the leg that makes
      # the claim mechanical. It takes seconds.
      - name: G9 corpus matches its generator (fixtures are synthetic by construction)
        run: node scripts/fixtures/g9-build.mjs --check

      # Round-6 M2: the documented upgrade rehearsal as a repeatable merge
      # gate, not a one-time local check. Reset to the merge-base's
      # migration set, verify the exact applied list, apply ONLY this
      # branch's increment, verify again, and re-run both suites against
      # the upgraded database. Skipped when HEAD == base (pushes to main).
      - name: Upgrade leg — base reset, increment apply, both suites
        run: |
          BASE=$(git merge-base HEAD origin/main)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is the base — no increment to rehearse"; exit 0
          fi
          git worktree add /tmp/upgrade-base "$BASE"
          npx supabase db reset --workdir /tmp/upgrade-base
          node scripts/verify-migration-state.mjs /tmp/upgrade-base/supabase/migrations
          npx supabase migration up
          node scripts/verify-migration-state.mjs supabase/migrations
          set -o pipefail
          npm run test:db 2>&1 | tee pgtap-upgrade.log
          npm run test:concurrency 2>&1 | tee concurrency-upgrade.log
          git worktree remove /tmp/upgrade-base

      # Round-7 E3: database logs and lock/activity diagnostics on failure —
      # the two-session layer's flakes are classifiable only with them.
      - name: Capture database logs (on failure)
        if: failure()
        run: |
          docker ps --filter name=supabase_db --format '{{.Names}}' \
            | xargs -r -n1 -I{} sh -c 'docker logs --tail 1000 {} > db-{}.log 2>&1' || true

      - name: Retain full test output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pgtap-*.log
            concurrency-*.log
            db-*.log
            vitest-app.log
            .vitest/run.json
            build.log
          if-no-files-found: ignore
          retention-days: 30

      # ══════════════════════════════════════════════════════════════════
      # Round-18, THE CI GAP — and it is OURS (ADR-0027 D11).
      #
      # CI ran no build, so D17's defect (F4) — a BUILD-TIME resolution
      # warning — could not have been caught here. It cost two gate runs and
      # two misdiagnoses locally.
      #
      # BUT THE BUILD STEP ALONE WOULD NOT HAVE CAUGHT IT EITHER, and that is
      # the half the packet understated. `Can't resolve <dynamic>` is a
      # WARNING: a build that emits it 556 times still exits 0, and a step
      # that only ran `npm run build` would have gone green through the whole
      # of D17. The step PLUS a zero-resolution-warning assertion is the fix,
      # and the warning count is exactly the signal ADR-0026 names as the tell.
      # ══════════════════════════════════════════════════════════════════
      - name: Build, and ZERO resolution warnings
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -qF "Can't resolve" build.log; then
            echo "::error::next build emitted module-resolution warnings (ADR-0026 D17 / ADR-0027 D11)"
            grep -nF "Can't resolve" build.log | head -20
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
