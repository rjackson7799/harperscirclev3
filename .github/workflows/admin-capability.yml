name: Admin isolated capability

on:
  push:
    branches: ['review/round33-handoff']
    paths:
      - '.github/workflows/admin-capability.yml'
      - 'scripts/probe-admin-auth-lifecycle.sql'
      - 'scripts/probe-admin-auth-live.mjs'
      - 'scripts/test-admin-boundary.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: admin-capability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned tools
        run: npm ci
      - name: Start disposable database and auth services together
        run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Clone the fresh local database with its original owners and dependencies
        run: |
          set -euo pipefail
          DB=supabase_db_HarpersCirclev3
          # Public default password of this disposable CLI stack, not a secret.
          test "$(docker exec -e PGPASSWORD=postgres "$DB" psql -U supabase_admin -d postgres -Atc 'SELECT count(*) FROM auth.users')" = 0
          docker exec -i -e PGPASSWORD=postgres "$DB" psql -U supabase_admin -d template1 -v ON_ERROR_STOP=1 <<'SQL'
          ALTER DATABASE postgres WITH ALLOW_CONNECTIONS false;
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'postgres';
          CREATE DATABASE hc_admin_probe TEMPLATE postgres;
          ALTER DATABASE postgres WITH ALLOW_CONNECTIONS true;
          SQL
      - name: Exercise auth trigger lifecycle with rollback
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_probe -v ON_ERROR_STOP=1 < scripts/probe-admin-auth-lifecycle.sql 2>&1 | tee admin-capability.log
      - name: Retain exact-source evidence
        if: always()
        run: git rev-parse HEAD > admin-capability-source.txt
      - name: Real MFA lifecycle and concurrent revocation
        run: node scripts/probe-admin-auth-live.mjs
      - name: Admin database boundary
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_probe -v ON_ERROR_STOP=1 < scripts/test-admin-boundary.sql 2>&1 | tee admin-boundary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-capability-${{ github.run_id }}
          path: |
            admin-capability.log
            admin-capability-source.txt
            admin-live-result.json
            admin-boundary.log
          retention-days: 14
