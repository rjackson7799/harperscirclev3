name: Admin isolated capability

on:
  push:
    branches: ['review/round33-handoff']
    paths:
      - '.github/workflows/admin-capability.yml'
      - 'scripts/probe-admin-auth-lifecycle.sql'
      - 'scripts/probe-admin-auth-live.mjs'
      - 'scripts/test-admin-boundary.sql'
      - 'scripts/test-admin-upgrade.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'lib/db/admin.ts'
      - 'tests/app/admin-read.test.ts'

permissions:
  contents: read

concurrency:
  group: admin-capability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned tools
        run: npm ci
      - name: Hold the two draft migrations for a pre-upgrade baseline
        run: |
          mkdir "$RUNNER_TEMP/admin-drafts"
          mv supabase/migrations/20260907120001_admin_auth_state.sql "$RUNNER_TEMP/admin-drafts/"
          mv supabase/migrations/20260907120002_admin_audited_read.sql "$RUNNER_TEMP/admin-drafts/"
      - name: Start disposable database and auth services together
        run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Clone the fresh local database with its original owners and dependencies
        run: |
          set -euo pipefail
          DB=supabase_db_HarpersCirclev3
          # Public default password of this disposable CLI stack, not a secret.
          test "$(docker exec -e PGPASSWORD=postgres "$DB" psql -U supabase_admin -d postgres -Atc 'SELECT count(*) FROM auth.users')" = 0
          docker exec -i -e PGPASSWORD=postgres "$DB" psql -U supabase_admin -d template1 -v ON_ERROR_STOP=1 <<'SQL'
          ALTER DATABASE postgres WITH ALLOW_CONNECTIONS false;
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'postgres';
          CREATE DATABASE hc_admin_probe TEMPLATE postgres;
          CREATE DATABASE hc_admin_upgrade TEMPLATE postgres;
          ALTER DATABASE postgres WITH ALLOW_CONNECTIONS true;
          SQL
      - name: Seed existing operator before applying either draft migration
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_upgrade -v seed=true -v ON_ERROR_STOP=1 < scripts/test-admin-upgrade.sql 2>&1 | tee admin-upgrade.log
      - name: Apply unchanged drafts to fresh and populated databases
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/admin-drafts/"*.sql supabase/migrations/
          git diff --exit-code -- supabase/migrations
          npx supabase migration up --local
          for db in hc_admin_probe hc_admin_upgrade; do
            for migration in supabase/migrations/2026090712000{1,2}_*.sql; do
              docker exec -i -e PGPASSWORD=postgres supabase_db_HarpersCirclev3 psql -U supabase_admin -d "$db" -v ON_ERROR_STOP=1 < "$migration" >> admin-upgrade.log 2>&1
            done
          done
      - name: Verify existing-state upgrade
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_upgrade -v seed=false -v ON_ERROR_STOP=1 < scripts/test-admin-upgrade.sql 2>&1 | tee -a admin-upgrade.log
      - name: Exercise auth trigger lifecycle with rollback
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_probe -v ON_ERROR_STOP=1 < scripts/probe-admin-auth-lifecycle.sql 2>&1 | tee admin-capability.log
      - name: Retain exact-source evidence
        if: always()
        run: git rev-parse HEAD > admin-capability-source.txt
      - name: Real MFA lifecycle and concurrent revocation
        run: node scripts/probe-admin-auth-live.mjs
      - name: Admin database boundary
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_probe -v ON_ERROR_STOP=1 < scripts/test-admin-boundary.sql 2>&1 | tee admin-boundary.log
      - name: Full database regression suite
        run: set -o pipefail; npm run test:db 2>&1 | tee admin-pgtap.log
      - name: Database lint
        run: set -o pipefail; npm run db:verify 2>&1 | tee admin-db-lint.log
      - name: Admin application and factory contracts
        run: npx vitest run tests/app/admin-read.test.ts tests/app/admin-session.test.ts tests/db/factories.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-capability-${{ github.run_id }}
          path: |
            admin-capability.log
            admin-capability-source.txt
            admin-live-result.json
            admin-boundary.log
            admin-pgtap.log
            admin-upgrade.log
            admin-db-lint.log
          retention-days: 14
