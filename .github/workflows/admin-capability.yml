name: Admin isolated capability

on:
  push:
    branches: ['review/round33-handoff']
    paths:
      - '.github/workflows/admin-capability.yml'
      - 'scripts/probe-admin-auth-lifecycle.sql'

permissions:
  contents: read

concurrency:
  group: admin-capability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned tools
        run: npm ci
      - name: Start disposable runner database
        run: npx supabase db start
      - name: Clone only the local auth schema into the isolated probe database
        run: |
          set -euo pipefail
          DB=supabase_db_HarpersCirclev3
          docker exec "$DB" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hc_admin_probe'
          docker exec "$DB" pg_dump -U postgres -d postgres --schema-only --schema=auth > auth-schema.sql
          docker exec -i "$DB" psql -U postgres -d hc_admin_probe -v ON_ERROR_STOP=1 < auth-schema.sql
      - name: Exercise auth trigger lifecycle with rollback
        run: |
          set -euo pipefail
          docker exec -i supabase_db_HarpersCirclev3 psql -U postgres -d hc_admin_probe -v ON_ERROR_STOP=1 < scripts/probe-admin-auth-lifecycle.sql 2>&1 | tee admin-capability.log
      - name: Retain exact-source evidence
        if: always()
        run: git rev-parse HEAD > admin-capability-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-capability-${{ github.run_id }}
          path: |
            admin-capability.log
            admin-capability-source.txt
          retention-days: 14
